[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "murmel-flash"
version = "4.1.0rc1"
description = "Dutch + English speech recognition: FastConformer hybrid CTC/attention models with punctuation, word timestamps, and domain word lists."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Maarten Sukel" }]
keywords = ["speech-recognition", "asr", "dutch", "english", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Natural Language :: Dutch",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "torch>=2.3",
  "numpy>=1.24",
  "sentencepiece>=0.2",
  "safetensors>=0.4",
  "huggingface_hub>=0.25",
  "soundfile>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
mic = ["sounddevice>=0.4"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/The-AI-Factory/murmel-flash-dutch-stt"
Models = "https://huggingface.co/theaifactorybv/murmel-flash-m-v5"

[project.scripts]
murmel-flash = "murmel_flash.cli:main"

[tool.setuptools.packages.find]
include = ["murmel_flash*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B905"]

[tool.ruff.lint.per-file-ignores]
"murmel_flash/server.py" = ["B008"]   # FastAPI's Depends()/File()/Form() defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
